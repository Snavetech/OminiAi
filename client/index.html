<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Snave AI — A powerful all-in-one AI assistant with chat, deep research, code execution, image generation, and document analysis.">
  <title>Snave AI</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/code.css">
  <link rel="stylesheet" href="css/modals.css">

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
  <div id="app">
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="brand-icon">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/><circle cx="12" cy="15" r="2"/></svg>
          </div>
          <span class="brand-text">Snave AI</span>
        </div>
        <button class="new-chat-btn" id="new-chat-btn" data-tooltip="Start a new conversation">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Chat
        </button>
        <div class="sidebar-search">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" id="search-chats" placeholder="Search conversations...">
        </div>
      </div>

      <div class="chat-list" id="chat-list">
        <!-- Chat items populated by JS -->
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-ghost" id="memory-btn" data-tooltip="Manage memories">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/><circle cx="12" cy="15" r="2"/></svg>
          Memory
        </button>
        <button class="btn btn-ghost" id="settings-btn" data-tooltip="Settings">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="top-bar-left">
          <button class="btn-icon" id="toggle-sidebar" data-tooltip="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <select class="personality-selector" id="personality-selector">
            <option value="professional">Professional</option>
            <option value="creative">Creative</option>
            <option value="coding">Coding Expert</option>
            <option value="research">Research Analyst</option>
            <option value="friendly">Friendly</option>
          </select>
        </div>


        <div class="top-bar-right">
          <button class="btn-icon" id="agent-toggle" data-tooltip="Agent Mode: Auto-detect tools">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1.07A7 7 0 0 1 14 23h-4a7 7 0 0 1-6.93-4H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/></svg>
          </button>
          <button class="btn-icon" id="theme-toggle" data-tooltip="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area" id="chat-area">
        <div class="messages-container" id="messages-container">
          <!-- Welcome Screen -->
          <div class="welcome-screen" id="welcome-screen">
            <h1 class="welcome-title">What can I help with?</h1>
          </div>
        </div>
      </div>

      <!-- Code Interpreter Panel -->
      <div class="code-panel" id="code-panel">
        <div class="code-panel-header">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Python Interpreter
          </h3>
          <button class="btn btn-ghost" id="close-code-panel">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Close
          </button>
        </div>
        <div class="pyodide-status" id="pyodide-status">
          <span class="status-dot"></span>
          <span id="pyodide-status-text">Python not loaded</span>
        </div>
        <div class="code-panel-body">
          <div class="code-editor-pane">
            <div class="code-editor-toolbar">
              <span>editor.py</span>
              <button class="run-btn" id="run-code-btn">▶ Run</button>
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="# Write your Python code here...
import numpy as np
print('Hello from Snave!')"></textarea>
          </div>
          <div class="code-output-pane">
            <div class="code-output-toolbar">
              <span>Output</span>
              <button class="btn btn-ghost" id="clear-output-btn" style="font-size:0.6875rem">Clear</button>
            </div>
            <div id="code-output"></div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area" id="input-area">
        <div class="input-wrapper">
          <div class="file-preview-area" id="file-preview-area"></div>
          <div class="input-container">
            <!-- Plus Button with Popup Menu -->
            <div class="plus-menu-wrapper">
              <button class="plus-btn" id="plus-menu-btn" data-tooltip="More options">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <div class="plus-menu" id="plus-menu">
                <button class="plus-menu-item" id="menu-attach">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  <span>Add photos & files</span>
                </button>
                <button class="plus-menu-item" data-mode="image" id="menu-image">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  <span>Create image</span>
                </button>
                <button class="plus-menu-item" data-mode="code" id="menu-code">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                  <span>Code interpreter</span>
                </button>
                <button class="plus-menu-item" data-mode="research" id="menu-research">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                  <span>Deep research</span>
                </button>
              </div>
            </div>
            <textarea id="chat-input" rows="1" placeholder="Ask anything"></textarea>
            <button class="send-btn" id="send-btn" disabled data-tooltip="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <!-- Quick action chips shown on welcome -->
          <div class="input-chips" id="input-chips">
            <button class="input-chip" data-prompt="Explain quantum computing in simple terms">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              Write or edit
            </button>
            <button class="input-chip" data-prompt="Research the latest breakthroughs in AI for 2026">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Look something up
            </button>
          </div>
          <div class="input-footer">
            <span id="mode-indicator">Chat Mode</span>
            <span>Snave AI</span>
          </div>
        </div>
      </div>
      <input type="file" id="file-input" class="hidden" multiple accept=".pdf,.docx,.doc,.txt,.png,.jpg,.jpeg,.gif,.webp">
    </main>
  </div>

  <!-- ═══ MODALS ═══ -->

  <!-- Memory Modal -->
  <div class="modal-backdrop" id="memory-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/><circle cx="12" cy="15" r="2"/></svg>
          Memory
        </h2>
        <button class="btn-icon" onclick="closeModal('memory-modal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:16px;display:flex;gap:8px">
          <input type="text" id="memory-input" placeholder="Add a memory..." style="flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border-primary);border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-primary);font-size:0.8125rem;outline:none;">
          <button class="btn btn-primary" id="add-memory-btn">Add</button>
        </div>
        <div class="memory-list" id="memory-list">
          <p style="color:var(--text-tertiary);text-align:center;padding:24px;font-size:0.8125rem">No memories saved yet.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </h2>
        <button class="btn-icon" onclick="closeModal('settings-modal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label>Gemini API Key</label>
          <input type="password" id="setting-gemini-key" placeholder="Enter your Gemini API key">
          <p class="hint">Get your free key at <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent-primary)">aistudio.google.com</a></p>
        </div>
        <div class="settings-group">
          <label>HuggingFace Token</label>
          <input type="password" id="setting-hf-token" placeholder="Enter your HuggingFace token">
          <p class="hint">Get your free token at <a href="https://huggingface.co/settings/tokens" target="_blank" style="color:var(--accent-primary)">huggingface.co</a></p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('settings-modal')">Cancel</button>
        <button class="btn btn-primary" id="save-settings-btn">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- ═══ INTRO ANIMATION OVERLAY ═══ -->
  <div id="intro-overlay">
    <div class="intro-content">
      <div class="intro-word" id="intro-word">
        <span class="intro-letter" data-index="0">E</span>
        <span class="intro-letter" data-index="1">v</span>
        <span class="intro-letter" data-index="2">a</span>
        <span class="intro-letter" data-index="3">n</span>
        <span class="intro-letter" data-index="4">s</span>
      </div>
      <div class="intro-subtitle" id="intro-subtitle">AI</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/research.js"></script>
  <script src="js/codeInterpreter.js"></script>
  <script src="js/imageGen.js"></script>
  <script src="js/fileHandler.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
