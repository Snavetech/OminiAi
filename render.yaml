services:
  - type: web
    name: snave-ai
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://agentrouter.org/v1
      - key: AGENTROUTER_MODEL
        value: gpt-5.6-sol
      - key: HF_API_TOKEN
        sync: false
